# ==============================================
# Shell
# ==============================================
shell /opt/homebrew/bin/zsh

# ==============================================
# Font Settings | 字体 + 连体 + 字号
# ==============================================
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
adjust_line_height 115%
adjust_column_width 100%

font_features        JetBrainsMonoNFM-Regular +cv11 +cv12 +cv18
font_features        JetBrainsMonoNFM-Light +cv11 +cv12 +cv18
font_features        JetBrainsMonoNFM-ExtraLight +cv11 +cv12 +cv18
font_features        JetBrainsMonoNFM-SemiBold +cv11 +cv12 +cv18
font_features        JetBrainsMonoNFM-Italic +cv12 +cv16 +cv18 +cv19 +cv20
font_features        JetBrainsMonoNFM-SemiBoldItalic +ss02 +cv12 +cv16 +cv18 +cv19 +cv20
font_size 12.0

# 启用连体字与 OpenType 特性
disable_ligatures never

symbol_map U+4E00-U+9FFF LXGW WenKai GB
symbol_map U+3400-U+4DBF LXGW WenKai GB
symbol_map U+20000-U+2A6DF LXGW WenKai GB
symbol_map U+2A700-U+2B73F LXGW WenKai GB
symbol_map U+2B740-U+2B81F LXGW WenKai GB
symbol_map U+2B820-U+2CEAF LXGW WenKai GB
symbol_map U+231A-U+231B,U+23E9-U+23EC,U+23F0,U+23F3,U+25FD-U+25FE,U+2600-U+2693,U+2694-U+269C,U+269D,U+269E-U+269F,U+26A0-U+26A1,U+26A2-U+26B1,U+26B2-U+26BC,U+26BD-U+26BF,U+26C4-U+26C5,U+26C6-U+26C8,U+26C9-U+26CD,U+26CE-U+26CF,U+26D0-U+26D1,U+26D2-U+26D3,U+26D4-U+26D5,U+26D6-U+26D7,U+26D8-U+26D9,U+26DA-U+26DB,U+26DC-U+26DD,U+26DE-U+26DF,U+26E0-U+26E1,U+26E2,U+26E3-U+26E7,U+26E8-U+26E9,U+26EA-U+26EF,U+26F0-U+26F1,U+26F2-U+26F3,U+26F4-U+26F5,U+26F6-U+26F9,U+26FA-U+26FB,U+26FC-U+26FF,U+2700-U+27BF,U+1F000-U+1F9FF,U+1FA70-U+1FAFF Segoe UI Emoji
symbol_map U+4E00-U+9FFF,U+3400-U+4DBF Maple Mono NF CN
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6AA,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A9,U+F500-U+F8FF,U+F0001-U+F1AF0 Symbols Nerd Font Mono

# 自动隐藏鼠标
mouse_hide_wait 3.0

# ==============================================
# Ayu Moon (Ayu Mirage) Color Palette
# ==============================================
foreground #cccac2
background #1f2430
cursor #ffcc66
cursor_text_color #1f2430
cursor_shape block
cursor_blink_interval 0

# 16 色 palette
color0  #171b24
color1  #ed8274
color2  #87d96c
color3  #facc6e
color4  #6dcbfa
color5  #dabafa
color6  #90e1c6
color7  #c7c7c7
color8  #686868
color9  #f28779
color10 #d5ff80
color11 #ffd173
color12 #73d0ff
color13 #dfbfff
color14 #95e6cb
color15 #ffffff

selection_background #274364
selection_foreground #cccac2

# ==============================================
# cursor
# ==============================================
cursor none
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 0
cursor_blink_interval 0.5 ease-in-out
confirm_os_window_close 0

# ==============================================
# Background Image & Transparency
# ==============================================
# Kitty 背景图片仅支持 PNG 格式
background_image ~/Pictures/Wallpaper/Apps/kitty.png
background_image_layout cscaled

# 图片本身的“着色”程度，值越高图片越暗、文字越清晰
background_tint 0.75

# 整体背景不透明度
background_opacity 0.85
dynamic_background_opacity yes

# 背景模糊（需 GPU 支持）
background_blur 18

# ==============================================
# Window & Padding
# ==============================================
window_padding_width 12
# Kitty 的 padding 是四边统一值，无法像 Ghostty 那样分别设置 x/y
# 如需单独控制可用 window_padding_width 配合 placement_strategy

macos_titlebar_style transparent
copy_on_select clipboard
mouse_hide_wait 0.5

# 确认关闭窗口时不显示提示（Kitty 无直接对应项，需在 macOS 系统偏好中调整）
# quit-after-last-window-closed 在 Kitty 中无对应配置，默认行为即为关闭最后窗口后退出

# ==============================================
# Misc
# ==============================================
term xterm-256color
active_border_color none

# 剪贴板权限控制
# write-clipboard: 允许程序写入系统剪贴板
# write-primary:   允许程序写入 X11 primary 选中缓冲区（鼠标选中即复制）
# read-clipboard:  允许程序读取系统剪贴板，不再弹窗确认（有安全风险，SSH远程慎用）
# read-primary:    允许程序读取 X11 primary 选中缓冲区，不再弹窗确认
clipboard_control write-clipboard write-primary read-clipboard read-primary
